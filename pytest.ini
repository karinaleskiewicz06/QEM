[pytest]
markers =
    slow: exercises the simulator or a runner end-to-end; excluded from the fast suite
# No testpaths: collect from the repository root so the original module tests
# (test_ansatz.py and friends) are picked up alongside tests/.
norecursedirs =
    banknote_study
    runs
    results_sim
    spec
    docs
    .planning
    trained_models_hard
    trained_models
    calibrations
    figures
    .git
    __pycache__
