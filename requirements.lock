# These are the versions actually installed on the machine that ran the hardware
# campaigns, not a target environment. The distinction matters: the transpiler is
# version-sensitive and the routing ladder differs between releases. On 2.4.1 the
# fixed-layout path gives 12/30/39/57 CZ, which reproduces the twirl campaign; on
# 2.5.2 the same path gives 12/27/36/54 and does not. See DATA_NOTES.md.
